name: Build debug APK

# Compila el APK en un runner de GitHub (gratis) — no necesitás instalar
# Android Studio ni nada en tu PC. Se dispara solo con cada push a main, o
# manualmente desde la pestaña "Actions" del repo ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Para crear la release con el APK (paso "Publicar release").
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete "tools" (legacy) ya no existe en el repositorio de
          # Google — solo queda "cmdline-tools". El default de esta acción
          # es "tools platform-tools", así que lo pisamos para que no
          # intente instalar el que ya no está.
          packages: "platform-tools"

      - name: Install SDK platform y build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Sin la clave fija, el APK saldría firmado con una clave distinta y no
      # se podría instalar encima de la versión anterior (ni actualizar desde
      # la app). Mejor que el build falle a publicar algo así.
      - name: Preparar clave de firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Faltan los secretos SIGNING_KEYSTORE_BASE64 y/o SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/handheld-alert.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/handheld-alert.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: handheld-alert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Los artifacts de Actions vencen a los 90 días; las releases no. Cada
      # build queda como release propia y el APK lleva siempre el mismo
      # nombre, así el link .../releases/latest/download/HandheldAlert.apk
      # baja siempre la última versión.
      - name: Preparar APK para la release
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk HandheldAlert.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: Handheld Alert ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: HandheldAlert.apk
          fail_on_unmatched_files: true
          body: |
            APK de Handheld Alert ${{ steps.apk.outputs.version }}, compilado desde ${{ github.ref_name }} (${{ github.sha }}).
            Al actualizar, desactivar y volver a activar el servicio de accesibilidad.

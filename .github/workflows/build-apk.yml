name: Build debug APK

# Compila el APK en un runner de GitHub (gratis) — no necesitás instalar
# Android Studio ni nada en tu PC. Se dispara solo con cada push a main, o
# manualmente desde la pestaña "Actions" del repo ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete "tools" (legacy) ya no existe en el repositorio de
          # Google — solo queda "cmdline-tools". El default de esta acción
          # es "tools platform-tools", así que lo pisamos para que no
          # intente instalar el que ya no está.
          packages: "platform-tools"

      - name: Install SDK platform y build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: handheld-alert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
